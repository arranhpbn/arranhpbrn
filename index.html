<script>
(() => {
  const paths = [...document.querySelectorAll('#ink path')];
  const nib = document.getElementById('nib');
  const hint = document.getElementById('hint');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // a pen that moves at a steady hand speed, lifting between strokes
  const WRITE_SPEED = 430, CROSS_SPEED = 620;              // viewBox units per second
  const LIFT = 170, WORD_GAP = 420, BEFORE_CROSSES = 750, CROSS_GAP = 260;
  const gapBefore = (i) => {
    const p = paths[i];
    if (i === 0) return 500;
    if (p.classList.contains('x')) return paths[i - 1].classList.contains('x') ? CROSS_GAP : BEFORE_CROSSES;
    return i === 1 ? WORD_GAP : LIFT;                        // stroke 1 is the H: start of the second word
  };

  let plan = [], total = 0;
  paths.forEach((p, i) => {
    const len = p.getTotalLength();
    p.style.strokeDasharray = len + ' ' + len;
    const speed = p.classList.contains('x') ? CROSS_SPEED : WRITE_SPEED;
    const start = total + gapBefore(i);
    const dur = len / speed * 1000;
    plan.push({ p, len, start, dur });
    total = start + dur;
  });

  // ease only the very ends of each stroke, so the pen settles in and lifts off
  const ease = (t) => t < .08 ? (t * t) / .16 : t > .92 ? 1 - ((1 - t) * (1 - t)) / .16 : t;

  let t0 = 0, raf = 0;
  function frame(now) {
    const t = now - t0;
    let tip = null;
    for (const s of plan) {
      const k = Math.min(1, Math.max(0, (t - s.start) / s.dur));
      s.p.style.strokeDashoffset = s.len * (1 - ease(k));
      if (k > 0 && k < 1) tip = s.p.getPointAtLength(s.len * ease(k));
    }
    if (tip) { nib.setAttribute('cx', tip.x); nib.setAttribute('cy', tip.y); }
    nib.classList.toggle('on', !!tip);
    if (t < total) raf = requestAnimationFrame(frame);
    else { nib.classList.remove('on'); hint.classList.add('on'); }
  }

  function write() {
    cancelAnimationFrame(raf);
    hint.classList.remove('on');
    if (reduce) { plan.forEach(s => s.p.style.strokeDashoffset = 0); return; }
    plan.forEach(s => s.p.style.strokeDashoffset = s.len);
    t0 = performance.now();
    raf = requestAnimationFrame(frame);
  }

  addEventListener('click', write);
  addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); write(); } });
  write();
})();
</script>
